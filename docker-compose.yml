version: '3.8'

services:
  # MongoDB Databases
  auth-db:
    image: mongo:7
    container_name: sicepat-auth-db
    environment:
      MONGO_INITDB_DATABASE: auth
    volumes:
      - auth-data:/data/db
    networks:
      - sicepat-network

  bookings-db:
    image: mongo:7
    container_name: sicepat-bookings-db
    environment:
      MONGO_INITDB_DATABASE: bookings
    volumes:
      - bookings-data:/data/db
    networks:
      - sicepat-network

  analytics-db:
    image: mongo:7
    container_name: sicepat-analytics-db
    environment:
      MONGO_INITDB_DATABASE: analytics
    volumes:
      - analytics-data:/data/db
    networks:
      - sicepat-network

  profile-db:
    image: mongo:7
    container_name: sicepat-profile-db
    environment:
      MONGO_INITDB_DATABASE: profile
    volumes:
      - profile-data:/data/db
    networks:
      - sicepat-network

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: sicepat-api-gateway
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - AUTH_SERVICE_URL=http://auth-service:3001
      - BOOKINGS_SERVICE_URL=http://bookings-service:3002
      - ANALYTICS_SERVICE_URL=http://analytics-service:3003
      - NOTIFICATIONS_SERVICE_URL=http://notifications-service:3004
      - PROFILE_SERVICE_URL=http://profile-service:3005
    depends_on:
      - auth-service
      - bookings-service
      - analytics-service
      - notifications-service
      - profile-service
    networks:
      - sicepat-network

  # Auth Service
  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: sicepat-auth-service
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=mongodb://auth-db:27017/auth
      - JWT_SECRET=sicepat_jwt_secret_key_2026_very_secure
      - JWT_EXPIRES_IN=24h
    depends_on:
      - auth-db
    networks:
      - sicepat-network

  # Bookings Service
  bookings-service:
    build:
      context: ./services/bookings
      dockerfile: Dockerfile
    container_name: sicepat-bookings-service
    environment:
      - NODE_ENV=production
      - PORT=3002
      - MONGODB_URI=mongodb://bookings-db:27017/bookings
      - NOTIFICATIONS_SERVICE_URL=http://notifications-service:3004
    depends_on:
      - bookings-db
    networks:
      - sicepat-network

  # Analytics Service
  analytics-service:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    container_name: sicepat-analytics-service
    environment:
      - NODE_ENV=production
      - PORT=3003
      - MONGODB_URI=mongodb://analytics-db:27017/analytics
      - BOOKINGS_SERVICE_URL=http://bookings-service:3002
    depends_on:
      - analytics-db
      - bookings-service
    networks:
      - sicepat-network

  # Notifications Service
  notifications-service:
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
    container_name: sicepat-notifications-service
    environment:
      - NODE_ENV=production
      - PORT=3004
      - MONGODB_URI=mongodb://bookings-db:27017/notifications
    networks:
      - sicepat-network

  # Profile Service
  profile-service:
    build:
      context: ./services/profile
      dockerfile: Dockerfile
    container_name: sicepat-profile-service
    environment:
      - NODE_ENV=production
      - PORT=3005
      - MONGODB_URI=mongodb://profile-db:27017/profile
    depends_on:
      - profile-db
    networks:
      - sicepat-network

  # Frontend (Nginx)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sicepat-frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - sicepat-network

networks:
  sicepat-network:
    driver: bridge

volumes:
  auth-data:
  bookings-data:
  analytics-data:
  profile-data:
